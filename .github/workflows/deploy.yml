name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN permissions needed by actions/deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent Pages deployment; don't cancel a run mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Blazor WebAssembly app
        run: dotnet publish -c Release -o ./publish

      # Project Pages serve the site from /<repo-name>/, so the base href must
      # match. Local dev keeps "/" (see wwwroot/index.html); the deployed copy
      # is rewritten here.
      - name: Set base href to repository subpath
        run: |
          repo='${{ github.event.repository.name }}'
          sed -i "s|<base href=\"/\" />|<base href=\"/$repo/\" />|" ./publish/wwwroot/index.html

      # GitHub Pages serves 404.html for unknown paths. A copy of index.html
      # lets the Blazor client router handle deep links (SPA fallback).
      - name: Add SPA fallback (404.html)
        run: cp ./publish/wwwroot/index.html ./publish/wwwroot/404.html

      # Disable Jekyll so folders like _framework/ (Blazor's DLLs) are served.
      - name: Add .nojekyll
        run: touch ./publish/wwwroot/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4